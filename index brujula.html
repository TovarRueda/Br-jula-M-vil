<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brújula Móvil</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .compass {
            width: 280px;
            height: 280px;
            border: 6px solid #333;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #222;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        /* Letras de orientación fijas */
        .marker {
            position: absolute;
            font-weight: bold;
            font-size: 1.2rem;
            color: #aaa;
        }
        .marker-n { top: 12px; color: #ff4444; }
        .marker-s { bottom: 12px; }
        .marker-e { right: 15px; }
        .marker-w { left: 15px; }

        /* La aguja de la brújula */
        .needle {
            width: 12px;
            height: 220px;
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform;
        }
        .needle::before {
            content: '';
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 110px solid #ff4444; /* Punta Norte Roja */
        }
        .needle::after {
            content: '';
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 110px solid #888; /* Punta Sur Gris */
        }
        #btn {
            margin-top: 25px;
            padding: 14px 28px;
            font-size: 1.1rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #info {
            margin-top: 15px;
            color: #aaa;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Brújula Móvil</h1>

    <div class="compass" id="compassBox">
        <!-- Letras del mapa -->
        <div class="marker marker-n">N</div>
        <div class="marker marker-s">S</div>
        <div class="marker marker-e">E</div>
        <div class="marker marker-w">O</div>

        <!-- Aguja -->
        <div class="needle" id="needle"></div>
    </div>

    <div id="info">Estado: Mueve el mouse o tu celular</div>
    <button id="btn">Activar Sensores del Celular</button>

    <script>
        const needle = document.getElementById('needle');
        const btn = document.getElementById('btn');
        const info = document.getElementById('info');
        const compassBox = document.getElementById('compassBox');

        let currentRotation = 0; // Ángulo actual suavizado
        let targetRotation = 0;  // Ángulo al que queremos llegar

        // Función matemática para calcular la diferencia más corta entre dos ángulos (evita el salto brusco de 360 a 0)
        function shortestAngle(target, current) {
            let diff = (target - current) % 360;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            return current + diff;
        }

        // Bucle de animación suave (Lerp)
        function animate() {
            currentRotation += (targetRotation - currentRotation) * 0.15;
            needle.style.transform = `rotate(${currentRotation}deg)`;
            requestAnimationFrame(animate);
        }
        animate(); // Iniciamos el bucle

        // Recibir datos y calcular la rotación destino
        function procesarGrados(grados) {
            let desiredRotation = 360 - grados;
            targetRotation = shortestAngle(desiredRotation, currentRotation);
            info.innerText = `Grados: ${Math.round(grados)}°`;
        }

        // 1. Sensores de celular
        function handleOrientation(e) {
            let heading = e.webkitCompassHeading !== undefined ? e.webkitCompassHeading : e.alpha;
            if (heading !== null && !isNaN(heading)) {
                procesarGrados(heading);
            }
        }

        function initCompass() {
            btn.style.display = 'none';
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                        info.innerText = "¡Mueve tu celular suavemente!";
                    } else {
                        btn.style.display = 'block';
                    }
                }).catch(() => { btn.style.display = 'block'; });
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
                info.innerText = "Mueve tu celular o el mouse";
            }
        }

        btn.addEventListener('click', initCompass);

        // 2. Simulador con el mouse (para pruebas locales en la PC)
        compassBox.addEventListener('mousemove', (e) => {
            const rect = compassBox.getBoundingClientRect();
            const centroX = rect.left + rect.width / 2;
            const centroY = rect.top + rect.height / 2;
            
            let rad = Math.atan2(e.clientY - centroY, e.clientX - centroX);
            let deg = rad * (180 / Math.PI) + 90;
            if (deg < 0) deg += 360;

            procesarGrados(deg);
        });
    </script>
</body>
</html>
