<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brújula Profesional Detallada</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .compass {
            width: 320px;
            height: 320px;
            border: 6px solid #444;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* Flecha roja de referencia (FIJA) */
        .fixed-arrow {
            position: absolute;
            top: 6px;
            z-index: 20;
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 26px solid #ff4444;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
        }

        /* Disco interior giratorio */
        .rotating-disk {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
        }

        /* Rosa de los vientos SVG interna */
        .compass-rose {
            position: absolute;
            width: 190px;
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Puntos cardinales principales */
        .marker {
            position: absolute;
            font-weight: bold;
            font-size: 1.2rem;
            color: #0f172a;
            z-index: 5;
        }
        .marker-n { top: 38px; }
        .marker-s { bottom: 38px; }
        .marker-e { right: 42px; }
        .marker-w { left: 42px; }

        /* Rayitas de grados */
        .degree-mark {
            position: absolute;
            width: 1px;
            height: 4px;       
            background: #cbd5e1;
            left: 50%;
            top: 8px;
            transform-origin: 50% 152px;
        }
        .degree-mark.medium {
            height: 7px;       
            width: 1px;
            background: #64748b;
        }
        .degree-mark.major {
            height: 11px;      
            width: 1.5px;
            background: #0f172a;
        }

        /* Números detallados alrededor */
        .degree-text {
            position: absolute;
            font-size: 0.58rem;
            font-weight: bold;
            color: #475569;
            left: 50%;
            top: 20px;
            transform-origin: 50% 138px;
            text-align: center;
            width: 30px;
            margin-left: -15px;
        }

        #btn {
            margin-top: 25px;
            padding: 14px 28px;
            font-size: 1.1rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #info {
            margin-top: 15px;
            color: #aaa;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Brújula Móvil</h1>

    <div class="compass" id="compassBox">
        <!-- Flecha roja fija arriba -->
        <div class="fixed-arrow"></div>

        <!-- Disco giratorio -->
        <div class="rotating-disk" id="rotatingDisk">
            <!-- Letras principales -->
            <div class="marker marker-n">N</div>
            <div class="marker marker-s">S</div>
            <div class="marker marker-e">E</div>
            <div class="marker marker-w">O</div>

            <!-- Rosa de los vientos (SVG) -->
            <div class="compass-rose">
                <svg viewBox="0 0 200 200" width="100%" height="100%">
                    <circle cx="100" cy="100" r="90" fill="none" stroke="#1e293b" stroke-width="1.5"/>
                    <circle cx="100" cy="100" r="82" fill="none" stroke="#1e293b" stroke-width="0.7"/>
                    <circle cx="100" cy="100" r="50" fill="none" stroke="#1e293b" stroke-width="0.7"/>
                    <polygon points="100,10 106,100 100,190 94,100" fill="#1e293b"/>
                    <polygon points="10,100 100,106 190,100 100,94" fill="#1e293b"/>
                    <polygon points="35,35 100,100 165,165" fill="none" stroke="#1e293b" stroke-width="1.5"/>
                    <polygon points="165,35 100,100 35,165" fill="none" stroke="#1e293b" stroke-width="1.5"/>
                    <polygon points="100,20 112,100 100,180 88,100" fill="#334155" opacity="0.8"/>
                    <polygon points="20,100 100,112 180,100 100,88" fill="#334155" opacity="0.8"/>
                </svg>
            </div>
        </div>
    </div>

    <div id="info">Estado: Mueve el mouse o tu celular</div>
    <button id="btn">Activar Sensores del Celular</button>

    <script>
        const rotatingDisk = document.getElementById('rotatingDisk');
        const btn = document.getElementById('btn');
        const info = document.getElementById('info');
        const compassBox = document.getElementById('compassBox');

        // Generar rayitas cada 2 grados y números cada 15 grados
        for (let i = 0; i < 360; i += 2) {
            const mark = document.createElement('div');
            
            if (i % 30 === 0) {
                mark.className = 'degree-mark major';
            } else if (i % 10 === 0) {
                mark.className = 'degree-mark medium';
            } else {
                mark.className = 'degree-mark';
            }

            mark.style.transform = `rotate(${i}deg)`;
            rotatingDisk.appendChild(mark);
        }

        // Bucle separado para asegurar que todos los números se impriman correctamente cada 15°
        for (let i = 0; i < 360; i += 15) {
            if (i !== 0 && i !== 90 && i !== 180 && i !== 270) {
                const text = document.createElement('div');
                text.className = 'degree-text';
                text.innerText = i;
                text.style.transform = `rotate(${i}deg)`;
                rotatingDisk.appendChild(text);
            }
        }

        let currentRotation = 0;
        let targetRotation = 0;

        function shortestAngle(target, current) {
            let diff = (target - current) % 360;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            return current + diff;
        }

        // Animación suave
        function animate() {
            currentRotation += (targetRotation - currentRotation) * 0.1;
            rotatingDisk.style.transform = `rotate(${currentRotation}deg)`;
            requestAnimationFrame(animate);
        }
        animate();

        function procesarGrados(grados) {
            let desiredRotation = -grados;
            targetRotation = shortestAngle(desiredRotation, currentRotation);
            info.innerText = `Grados: ${Math.round(grados)}°`;
        }

        function handleOrientation(e) {
            let heading = e.webkitCompassHeading !== undefined ? e.webkitCompassHeading : e.alpha;
            if (heading !== null && !isNaN(heading)) {
                procesarGrados(heading);
            }
        }

        function initCompass() {
            btn.style.display = 'none';
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                        info.innerText = "¡Mueve tu celular suavemente!";
                    } else {
                        btn.style.display = 'block';
                    }
                }).catch(() => { btn.style.display = 'block'; });
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
                info.innerText = "Mueve tu celular o el mouse";
            }
        }

        btn.addEventListener('click', initCompass);

        // Simulador de mouse para probar en la PC
        compassBox.addEventListener('mousemove', (e) => {
            const rect = compassBox.getBoundingClientRect();
            const centroX = rect.left + rect.width / 2;
            const centroY = rect.top + rect.height / 2;
            
            let rad = Math.atan2(e.clientY - centroY, e.clientX - centroX);
            let deg = rad * (180 / Math.PI) + 90;
            if (deg < 0) deg += 360;

            procesarGrados(deg);
        });
    </script>
</body>
</html>
